<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Pear">
  <defs>
    <linearGradient id="bg-loose-pear-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9e6ef"/>
      <stop offset="100%" stop-color="#c6c0d6"/>
    </linearGradient>
    <linearGradient id="gem-loose-pear-1" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="50%" stop-color="#e8e2f5"/><stop offset="100%" stop-color="#b6a7d8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg-loose-pear-1)"/>
  <circle cx="300" cy="290" r="205" fill="#ffffff" opacity="0.10"/>
  
    <g transform="translate(300 285)">
      <!-- crown -->
      <polygon points="-150,-40 150,-40 95,-95 -95,-95" fill="url(#gem-loose-pear-1)"/>
      <polygon points="-95,-95 95,-95 45,-95 -45,-95" fill="#ffffff" opacity="0.30"/>
      <polygon points="-150,-40 -95,-95 -60,-40" fill="#ffffff" opacity="0.20"/>
      <polygon points="150,-40 95,-95 60,-40" fill="#000000" opacity="0.10"/>
      <!-- girdle highlight -->
      <rect x="-150" y="-40" width="300" height="6" fill="#ffffff" opacity="0.45"/>
      <!-- pavilion -->
      <polygon points="-150,-34 150,-34 0,180" fill="url(#gem-loose-pear-1)"/>
      <polygon points="-150,-34 -50,-34 -80,60" fill="#ffffff" opacity="0.16"/>
      <polygon points="150,-34 50,-34 80,60" fill="#000000" opacity="0.12"/>
      <polygon points="-50,-34 50,-34 0,180" fill="#ffffff" opacity="0.10"/>
    </g>
</svg>
