<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Pendant">
  <defs>
    <linearGradient id="bg-necklace-pendant-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efe6d4"/>
      <stop offset="100%" stop-color="#d4bd94"/>
    </linearGradient>
    <linearGradient id="gem-necklace-pendant-1" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="50%" stop-color="#f1e6ee"/><stop offset="100%" stop-color="#c9a7c2"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg-necklace-pendant-1)"/>
  <circle cx="300" cy="290" r="205" fill="#ffffff" opacity="0.10"/>
  
    <g transform="translate(300 285)">
      <!-- crown -->
      <polygon points="-150,-40 150,-40 95,-95 -95,-95" fill="url(#gem-necklace-pendant-1)"/>
      <polygon points="-95,-95 95,-95 45,-95 -45,-95" fill="#ffffff" opacity="0.30"/>
      <polygon points="-150,-40 -95,-95 -60,-40" fill="#ffffff" opacity="0.20"/>
      <polygon points="150,-40 95,-95 60,-40" fill="#000000" opacity="0.10"/>
      <!-- girdle highlight -->
      <rect x="-150" y="-40" width="300" height="6" fill="#ffffff" opacity="0.45"/>
      <!-- pavilion -->
      <polygon points="-150,-34 150,-34 0,180" fill="url(#gem-necklace-pendant-1)"/>
      <polygon points="-150,-34 -50,-34 -80,60" fill="#ffffff" opacity="0.16"/>
      <polygon points="150,-34 50,-34 80,60" fill="#000000" opacity="0.12"/>
      <polygon points="-50,-34 50,-34 0,180" fill="#ffffff" opacity="0.10"/>
    </g>
</svg>
