name: CI

# Fast checks on every push and pull request. Vercel does the real build and
# deploy; this catches type errors, lint problems and broken logic first.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Generates the typed route helpers (PageProps<"/...">) tsc relies on.
      - run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
